[project]
name = "ah-transcribe"
version = "0.1.0"
description = "Lyrics and speech transcription with word timestamps (faster-whisper)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "audio-harness",
    "faster-whisper==1.2.1",
]

[tool.uv.sources]
audio-harness = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ah_transcribe"]
