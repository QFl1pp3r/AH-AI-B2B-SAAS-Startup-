[project]
name = "ah-denoise"
version = "0.1.0"
description = "Speech denoising with DeepFilterNet3: ah tool and HTTP service"
# DeepFilterLib 0.5.6 has no cp312 wheels. Versions match the Colab benchmark env (df311).
requires-python = ">=3.11,<3.12"
dependencies = [
    "audio-harness",
    "deepfilternet==0.5.6",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "numpy<2",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
audio-harness = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ah_denoise", "src/denoise_service"]
