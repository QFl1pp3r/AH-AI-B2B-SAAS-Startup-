[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-harness-denoise"
version = "0.1.0"
description = "HTTP service for DeepFilterNet denoising"
requires-python = ">=3.10,<3.13"
dependencies = [
  "deepfilternet>=0.5",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9",
  "torch>=2.1",
  "torchaudio>=2.1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
