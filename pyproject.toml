[project]
name = "audio-harness"
version = "0.1.0"
description = "Audio tools behind one CLI: artifact store, separation, speech restoration, BPM/key/chords"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3.7",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["gradio>=4.44"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
ah = "ah.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
